[project]
name = "money-s3-writer"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "freezegun>=1.5.1",
    "keboola-component>=1.11.0",
    "keboola-http-client>=1.0.1",
    "keboola-utils>=1.1.0",
    "pydantic>=2.11.7",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "keboola.datadirtest>=2.0.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I", "UP", "G"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
